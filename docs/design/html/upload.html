  </header>
  <div class="flex-1 overflow-y-auto">
    <div class="max-w-[760px] mx-auto p-8">

      <div class="flex items-center justify-between max-w-lg mx-auto mb-8 px-2">

        </div>
        <div class="flex-1 h-px bg-sage-accent/40 mx-3 mb-4"></div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-9 h-9 rounded-full bg-sage-accent text-white text-xs font-bold flex items-center justify-center">2</div>
          <span class="text-[11px] text-sage-accent">解析</span>
        </div>
        <div class="flex-1 h-px bg-card-border mx-3 mb-4"></div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-9 h-9 rounded-full bg-white border border-card-border text-secondary-text text-xs font-bold flex items-center justify-center">3</div>

          </div>
          <p class="text-sm font-semibold mb-0.5">上传文档</p>
          <p class="text-[11px] text-secondary-text">PDF、TXT、MD、DOCX</p>
        </button>
        <button type="button" data-method="image" class="method-card text-left rounded-2xl border border-card-border bg-foggy-bg p-4">
          <div class="method-icon w-10 h-10 rounded-xl bg-[#F3F6F5] text-sage-accent flex items-center justify-center mb-3">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg>

                <p class="text-sm font-medium">Flutter 核心组件.pdf</p>

            </div>
            <a href="quiz.html" class="text-xs text-sage-accent hover:text-sage-dark shrink-0">去资料</a>

<script src="status-rail.js"></script>
<input id="file" type="file" class="hidden" accept=".pdf,.txt,.md,.docx,.pptx,.png,.jpg,.jpeg">
<script>
  (function () {
    var hints = {
      doc: ["把文件拖到这里，或点选上传", "支持 PDF、TXT、MD、DOCX"],
      image: ["把图片拖到这里，或点选上传", "支持 PNG、JPG、WEBP"],
      camera: ["打开相机拍一页讲义", "拍完会按图片一样识别文字"]
    };
    document.querySelectorAll("[data-method]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("[data-method]").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        var h = hints[btn.getAttribute("data-method")];
        document.getElementById("dropTitle").textContent = h[0];
        document.getElementById("dropHint").textContent = h[1];
      });
    });
    var drop = document.getElementById("drop");
    var file = document.getElementById("file");
    function take(f) {
      if (!f) return;
      document.getElementById("dropTitle").textContent = f.name;
      document.getElementById("dropHint").textContent = "已选择（演示，未上传到服务器）";
      if (window.ZhixuTasks) ZhixuTasks.recordUpload(f.name);
    }
    drop.addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { take(file.files && file.files[0]); });
    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("border-sage-accent"); });
    });
    drop.addEventListener("dragleave", function () { drop.classList.remove("border-sage-accent"); });
    drop.addEventListener("drop", function (e) {
      e.preventDefault();
      drop.classList.remove("border-sage-accent");
      take(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
    });
  })();
</script>
