        <div class="flex gap-2 mt-2">
          <button type="button" id="sel-all" class="text-[11px] text-sage-accent hover:text-sage-dark">全选</button>
          <button type="button" id="sel-none" class="text-[11px] text-secondary-text hover:text-sage-accent">清空</button>

      </div>
      <div id="page-list" class="flex-1 overflow-y-auto p-2"></div>
    </aside>

      </div>
      <div class="px-4 py-3 border-b border-card-border shrink-0 space-y-3">

          <p class="font-medium text-sage-dark mb-0.5">Tina 按目录选好了页</p>
          <p class="text-secondary-text">「生命周期与 build」· 第 5–9 页。和你手动勾选走同一条出题接口。</p>
        </div>
        <p id="sel-hint" class="text-[11px] text-secondary-text leading-relaxed">左侧勾选页面。已选 <span id="sel-count">0</span> 页，单次最多 10 页。</p>
        <button type="button" id="gen-btn" class="w-full py-2 rounded-full bg-sage-accent text-white text-sm font-medium hover:bg-sage-dark disabled:opacity-50" disabled>AI 批量出题</button>
        <div id="gen-result" class="hidden rounded-xl border border-card-border bg-[#F3F6F5] px-3 py-2 text-[11px] leading-relaxed">
          生成完成：新建 <span id="gen-new">0</span> 题。
          <a href="quiz-doc.html" class="text-sage-accent hover:text-sage-dark">回这本书</a>
        </div>
      </div>

        <p class="text-secondary-text text-center py-8">勾选页面后点「AI 批量出题」</p>
      </div>
    </aside>
