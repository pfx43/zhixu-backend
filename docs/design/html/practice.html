<main class="flex-1 flex flex-col min-w-0 overflow-hidden bg-foggy-bg">

          </div>

        </div>
        <div class="flex-1 min-h-0 overflow-y-auto p-6">
          <p class="font-semibold text-sm mb-4 leading-relaxed">Widget 的 build 方法最恰当的描述是？</p>
          <div id="opts" class="space-y-2.5">
            <button type="button" class="opt w-full text-left rounded-xl border border-card-border px-4 py-3 text-sm"><span class="font-medium mr-2">A.</span>可以随意产生副作用，例如直接改全局变量</button>
            <button type="button" class="opt w-full text-left rounded-xl border border-card-border px-4 py-3 text-sm"><span class="font-medium mr-2">B.</span>应尽量保持纯净，根据当前配置返回 UI 描述</button>
            <button type="button" class="opt w-full text-left rounded-xl border border-card-border px-4 py-3 text-sm"><span class="font-medium mr-2">C.</span>只能返回 StatefulWidget</button>
            <button type="button" class="opt w-full text-left rounded-xl border border-card-border px-4 py-3 text-sm"><span class="font-medium mr-2">D.</span>每次调用都必须配合 setState</button>
          </div>
        </div>
        <div class="shrink-0 border-t border-card-border px-6 py-4 flex flex-wrap items-center gap-3">
          <button type="button" id="q-submit" class="px-4 py-2 rounded-full bg-sage-accent text-white text-sm font-medium hover:bg-sage-dark">提交</button>
          <button type="button" id="q-unknown" class="px-4 py-2 rounded-full border border-card-border bg-white text-sm text-secondary-text">我不会</button>
          <button id="q-feedback-open" data-q-feedback type="button" class="ml-auto px-4 py-2 rounded-full border border-card-border bg-white text-sm text-secondary-text hover:text-bad hover:border-bad">这题不对</button>
        </div>

<script src="tip.js"></script>
<script>
  (function () {
    function paint() {
      if (!window.ZhixuTasks) return;
      var p = ZhixuTasks.progress();
      document.getElementById("task-progress").textContent =
        "测量 " + p.quizAnswered + "/8 · 不会 " + p.unknownAnswered + "/3";
      var n = Math.min(16, p.quizAnswered + 1);
      document.getElementById("q-index").textContent = "第 " + n + " / 16 题";
    }
    document.getElementById("opts").addEventListener("click", function (e) {
      var btn = e.target.closest(".opt");
      if (!btn) return;
      document.querySelectorAll(".opt").forEach(function (el) { el.classList.remove("is-on"); });
      btn.classList.add("is-on");
    });
    function answer(kind) {
      if (window.ZhixuTasks) ZhixuTasks.recordQuiz(kind);
      paint();
    }
    document.getElementById("q-submit").addEventListener("click", function () { answer("submit"); });
    document.getElementById("q-unknown").addEventListener("click", function () { answer("unknown"); });
    paint();
  })();
</script>
