name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: zhixu
          POSTGRES_PASSWORD: zhixu
          POSTGRES_DB: zhixu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://zhixu:zhixu@localhost:5432/zhixu_test
      TEST_DATABASE_URL: postgresql+psycopg2://zhixu:zhixu@localhost:5432/zhixu_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Whitespace check
        run: git diff --check

      - name: Alembic single head
        run: |
          python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          assert len(heads) == 1, f'multiple alembic heads: {heads}'
          "

      - name: Run tests
        run: python -m pytest test/ -q
